services:
  my-mysql:
    container_name: my-mysql
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_NAME}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - port-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    container_name: backend
    image: rohit5126/portfolio-backend:latest
    env_file:
      - backend/.env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - port-net
    restart: unless-stopped
    depends_on:
      my-mysql: 
        condition: service_healthy

  frontend:
    container_name: frontend
    image: rohit5126/portfolio-frontend:latest
    ports:
      - "${FRONTEND_PORT}:80"
    restart: unless-stopped
    networks:
      - port-net
    depends_on:
      - backend

networks:
  port-net:
    driver: bridge

volumes:
  mysql-data:
    



  

